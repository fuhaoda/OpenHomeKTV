<!DOCTYPE html>
<html>

<head>
	{% if title %}
	<title>{{site_title}} - {{ title }}</title>
	{% else %}
	<title>{{site_title}}</title>
	{% endif %}
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="/static/jquery-3.3.1.min.js"></script>
	<script src="/static/jquery-ui.min.js"></script>
	<script src="/static/js.cookie-2.2.1.min.js"></script>
	<script src="/static/lodash.min.js"></script>
	<script src="/static/jquery.ui.touch-punch.min.js"></script>
	<script src="/static/app.js"></script>
	<link rel="stylesheet" href="/static/jquery-ui.min.css">
	<link rel="stylesheet" href="/static/bulma-dark.css">
	<link rel="stylesheet" href="/static/custom.css">
	<link rel="icon" type="image/png" href="/static/images/now-playing.png">
	<link rel="stylesheet" href="/static/fontello/css/fontello.css">
</head>

<style>
.navbar-item > i { margin-right: 2px; font-size: 24px; }
.current-user { position: fixed; padding: 3px; bottom: 5px; right: 10px; }
tr:nth-child(even) { background-color: rgb(50, 55, 55); }
@media screen and (max-width: 500px) {
	.navbar-brand > .navbar-item > span { display: none; }
}
.hide {display: none;}
.hand {cursor: pointer;}
</style>

<body>
	<nav class="navbar" role="navigation" aria-label="main navigation" style="position: fixed; top:0; width: 100%; overflow: hidden;">
		<div class="navbar-brand" id="brand" style="padding-left: 10px">
			<a id="home" class="navbar-item" onclick="switch_pane('/f_home')">
				<i class="icon icon-home-2" title="{{getString1(183)}}"></i>
				<span>{{getString1(183)}}</span>
			</a>
			<a id="queue" class="navbar-item" onclick="switch_pane('/f_queue')">
				<i class="icon icon-list-numbered" title="{{getString1(112)}}"></i>
				<span>{{getString1(112)}}</span>
			</a>
			<a id="browse" class="navbar-item" onclick="switch_pane('/f_browse')">
				<i class="icon icon-folder-open-empty" title="{{getString1(98)}}"></i>
				<span>{{getString1(98)}}</span>
			</a>
			<a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false">
				<span aria-hidden="true"></span>
				<span aria-hidden="true"></span>
				<span aria-hidden="true"></span>
			</a>
		</div>
		<div class="navbar-menu" id="menu">
			<div class="navbar-end">
				<a id="current-user" class="navbar-item" href="#">
					<i class="icon icon-adult" title="{{getString1(134)}}"></i>
					<span></span>
				</a>
				<a id="current-lang" class="navbar-item" href="#">
					<i class="icon icon-globe" title="{{getString1(184)}}"></i>
					<span>{{getString1(1)}}</span>
				</a>
				<a id="info" class="navbar-item" onclick="switch_pane('/f_info')">
					<i class="icon icon-cog" title="{{getString1(193)}}"></i>
					<span>{{getString1(135)}}</span>&nbsp;&nbsp;
				</a>
			</div>
		</div>
	</nav>
	<div class="container" style="padding: 5px; max-width: 900px; margin-top: 55px;">
		<div id="notification" class="notification hide">
			<button class="delete" onclick="$('.notification').hide();"></button>
			<div class="flash"></div>
			<p id="notificationControls" style="float:right; cursor: pointer;">{{getString1(229)}}</p>
		</div>
		<div class="box" id="container" style="margin-top: 5px;"></div>
	</div>
<script>
var timer = null, currentUser, ws = null, paneCleanup = null;
var activePaneRequest = null, paneLoadSeq = 0;
var last_pane = Cookies.get('last_pane') || '/f_home';
var reconnectTimer = null, reconnectDelay = 1000, closingPage = false;
var notificationTimer = null;
function closeNav() {
  $('.navbar-burger, .navbar-menu').removeClass('is-active');
}
function switch_pane(name) {
  var target = new URL(name, location.href);
  if (target.origin !== location.origin || !['/f_home', '/f_queue', '/f_browse', '/f_info'].includes(target.pathname)) {
    target = new URL('/f_home', location.origin);
  }
  var stem = target.pathname;
  clearInterval(timer);
  timer = null;
  if (typeof paneCleanup === 'function') paneCleanup();
  paneCleanup = null;
  $(document).off('scroll.ktvBrowse');
  if (activePaneRequest && activePaneRequest.readyState !== 4) activePaneRequest.abort();
  var requestSeq = ++paneLoadSeq;
  last_pane = stem;
  ['home', 'queue', 'browse', 'info'].forEach(function (pane) {
    $('#' + pane).toggleClass('is-active', stem === '/f_' + pane);
  });
  activePaneRequest = $.get(target.pathname + target.search).done(function (data) {
    if (requestSeq !== paneLoadSeq) return;
    $('#container').html(data);
    activePaneRequest = null;
  }).fail(function (_xhr, status) {
    if (requestSeq === paneLoadSeq && status !== 'abort') activePaneRequest = null;
  });
  closeNav();
}
function get_refresh(url, pane) {
  $.get(url).done(function () { switch_pane(pane || last_pane); }).fail(KTV.showRequestError);
}
function post_switch(url, data) {
  $.post(url, data).done(function () { switch_pane(last_pane); }).fail(KTV.showRequestError);
}
function showNotification(message, categoryClass, timeout) {
  clearTimeout(notificationTimer);
  var notification = $('#notification');
  notification.stop(true, true).removeClass('is-info is-success is-warning is-danger').addClass(categoryClass || 'is-info');
  notification.find('.flash').text(message == null ? '' : message);
  $('#notificationControls').hide().off('click.ktv');
  notification.show();
  notificationTimer = setTimeout(function () { notification.fadeOut(); }, timeout || 3000);
}
function notifyWithControl(message, action, timeout) {
  showNotification(message, 'is-info', timeout);
  $('#notificationControls').show().off('click.ktv').on('click.ktv', action);
}
function setLanguage(lang, reload) {
  Cookies.set('lang', lang, {expires: 3650});
  Cookies.set('last_pane', last_pane);
  if (reload) { window.scrollTo(0, 0); location.reload(); }
}
$('.navbar-burger').on('click', function () {
  $('.navbar-burger, .navbar-menu').toggleClass('is-active');
});
function set_user(user) {
  return KTV.rememberUserName(user);
}
function load_cur_user() {
  currentUser = KTV.initializeUserName();
}
$('#current-user').on('click', function (event) {
  event.preventDefault();
  var oldName = KTV.getSavedUserName();
  var name = KTV.promptUserName(oldName || '');
  if (name !== null) {
    if (!oldName) { set_user(name); closeNav(); return; }
    $.post('/user_rename', {old_name: oldName, new_name: name}).done(function () {
      set_user(name); closeNav();
    }).fail(KTV.showRequestError);
  }
});
load_cur_user();
var currentLang = Cookies.get('lang');
if (!currentLang) { currentLang = navigator.language; setLanguage(currentLang, false); }
$('#current-lang').on('click', function (event) {
  event.preventDefault();
  $.get('/get_lang_list').done(function (data) {
    var languages = KTV.parseData(data);
    if (!languages || typeof languages !== 'object') return;
    var popup = $('<div>').attr('title', {{getString1(185)|tojson}});
    Object.keys(languages).forEach(function (language) {
      var label = $('<label>').addClass('language-choice');
      $('<input>', {type: 'radio', name: 'language', checked: currentLang === language})
        .on('change', function () { setLanguage(language, true); }).appendTo(label);
      label.append(document.createTextNode(' ' + languages[language])).appendTo(popup);
    });
    popup.dialog({width: Math.min(400, window.innerWidth - 24), close: function () { popup.dialog('destroy').remove(); }});
  });
});
function handleSocketMessage(raw) {
  KTV.dispatchMessage(raw, {
    nowplaying: function (data) {
      if (last_pane === '/f_home' && typeof window.updateNowPlaying === 'function') window.updateNowPlaying(data);
    },
    queue: function (data) {
      if (last_pane === '/f_queue' && typeof window.updateQueue === 'function') window.updateQueue(data);
    },
    notification: function (data) {
      if (data && typeof data.message === 'string') showNotification(data.message, data.category);
    }
  });
}
function open_wsock_if_nec() {
  if (closingPage || (ws && ws.readyState < 2)) return ws;
  var socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws_init');
  ws = socket;
  socket.addEventListener('open', function () { reconnectDelay = 1000; });
  socket.addEventListener('message', function (event) { handleSocketMessage(event.data); });
  socket.addEventListener('error', function () { socket.close(); });
  socket.addEventListener('close', function () {
    if (ws === socket) ws = null;
    if (closingPage || reconnectTimer !== null) return;
    reconnectTimer = setTimeout(function () { reconnectTimer = null; open_wsock_if_nec(); }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  });
  return socket;
}
window.addEventListener('pagehide', function () {
  closingPage = true;
  clearTimeout(reconnectTimer);
  if (ws) ws.close();
  clearInterval(timer);
  if (typeof paneCleanup === 'function') paneCleanup();
});
window.addEventListener('pageshow', function (event) {
  if (event.persisted) { closingPage = false; reconnectTimer = null; open_wsock_if_nec(); switch_pane(last_pane); }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) open_wsock_if_nec(); });
open_wsock_if_nec();
switch_pane(last_pane);
</script>
</body>

</html>
